apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router-service
  template:
    metadata:
      labels:
        app: router-service
    spec:
      nodeSelector:
        agentpool: userpool
      containers:
        - name: router-service
          image: aiinfrasprintacr.azurecr.io/router-service:v1
          ports:
            - containerPort: 8000
          env:
            - name: TINYLLAMA_URL
              value: "http://tinyllama-server/generate"
            - name: FOUNDRY_URL
              value: "https://ai-infra-sprint-foundry.services.ai.azure.com/models/chat/completions?api-version=2024-05-01-preview"
            - name: LENGTH_THRESHOLD
              value: "100"
            - name: FOUNDRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: foundry-secrets
                  key: FOUNDRY_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: router-service
spec:
  selector:
    app: router-service
  ports:
    - port: 80
      targetPort: 8000
